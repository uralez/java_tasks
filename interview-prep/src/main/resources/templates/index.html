<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head th:replace="~{fragments/head :: head(#{welcome.title})}"></head>
<body class="page-index">
<div class="page">

    <div th:replace="~{fragments/topbar :: topbar('/')}"></div>

    <div class="welcome">
        <h1><span th:text="#{welcome.title}">Hello, </span><span th:text="${#authentication.name}">студент</span></h1>
        <p class="subtitle" th:text="#{welcome.subtitle}">Продолжайте практику &mdash; каждый ответ приближает вас к цели</p>
    </div>

    <div class="grid">
        <div class="panel">
            <div class="panel-title" th:text="#{panel.myTopics}">My Topics</div>
            <div th:if="${errorMessage}" class="field-validation-error" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" id="toast" class="toast" th:text="${successMessage}"></div>
            <div class="panel-title-row" sec:authorize="hasRole('ADMIN')">
                <button type="button" class="admin-btn admin-btn-add" th:title="#{admin.topic.add}">T<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
            </div>

            <div th:if="${#lists.isEmpty(topicStats)}" class="panel-desc" th:text="#{panel.noAnswers}">
                Ответов пока нет. Зарегистрируйте первый ответ.
            </div>

            <table th:if="${!#lists.isEmpty(topicStats)}" class="stats-table">
                <thead>
                    <tr>
                        <th th:text="#{panel.topics.topic}">Topic</th>
                        <th th:text="#{panel.topics.count}">Answers</th>
                        <th th:text="#{panel.topics.avg}">Average Grade</th>
                    </tr>
                </thead>
                <tbody>
                    <th:block th:each="stat : ${topicStats}">
                        <tr class="topic-row" th:attr="data-topic=${stat.topicName}">
                            <td>
                                <span class="item-id" th:text="'#' + ${stat.topicOrderNumber}"></span>
                                <span th:text="${stat.topicName}"></span>
                                <span sec:authorize="hasRole('ADMIN')" class="admin-controls">
                                    <button type="button" class="admin-btn admin-btn-edit"  th:attr="data-topic-id=${stat.topicId}"     th:title="#{admin.topic.edit}">T<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M11.5 2.5l2 2L5 13l-3 1 1-3 8.5-8.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
                                    <button type="button" class="admin-btn admin-btn-add"   th:attr="data-topic-id=${stat.topicId}"     th:title="#{admin.question.add}">Q<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
                                    <button type="button" class="admin-btn admin-btn-delete" th:attr="data-topic-id=${stat.topicId}"    th:title="#{admin.topic.delete}">T<svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M2 3.5h10M5.5 3.5V2.5h3v1M6 6.5v4M8 6.5v4M3 3.5l.7 7.5a.5.5 0 00.5.5h5.6a.5.5 0 00.5-.5L11 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                                </span>
                            </td>
                            <td th:text="${#numbers.formatDecimal(stat.answerCount, 1, 1)}"></td>
                            <td th:text="${#numbers.formatDecimal(stat.avgGrade, 1, 1)}"></td>
                        </tr>
                        <tr class="questions-row" th:attr="data-topic=${stat.topicName}" style="display:none;">
                            <td colspan="3">
                                <ul class="questions-list">
                                    <li th:each="q : ${stat.questions}"
                                        th:attr="data-id=${q.id}, data-topic=${stat.topicName}"
                                        class="question-item">
                                        <span class="item-id" th:text="'#' + ${q.orderNumber}"></span>
                                        <span th:text="${q.text}"></span>
                                        <span sec:authorize="hasRole('ADMIN')" class="admin-controls">
                                            <button type="button" class="admin-btn admin-btn-edit"      th:attr="data-id=${q.id}" th:title="#{admin.question.edit}">Q<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M11.5 2.5l2 2L5 13l-3 1 1-3 8.5-8.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
                                            <button type="button" class="admin-btn admin-btn-delete"    th:attr="data-id=${q.id}" th:title="#{admin.question.delete}">Q<svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M2 3.5h10M5.5 3.5V2.5h3v1M6 6.5v4M8 6.5v4M3 3.5l.7 7.5a.5.5 0 00.5.5h5.6a.5.5 0 00.5-.5L11 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                                        </span>
                                    </li>
                                </ul>
                            </td>
                        </tr>
                    </th:block>
                </tbody>
            </table>
        </div>

        <div class="panel">
            <div class="panel-title" th:text="#{panel.gradeChart}">Grade Dynamics</div>
            <canvas id="gradeChart"></canvas>
        </div>

        <div class="panel wide">
            <div class="panel-title" th:text="#{panel.registerAnswer}">Register Answer</div>

            <form th:action="@{/answer}" method="post">

                <div class="field">
                    <div class="field-label-row">
                        <label for="topicId" th:text="#{form.topic}">Topic</label>
                    </div>
                    <select id="topicId" name="topicId" class="field-select">
                        <option value="" th:text="#{form.topic.placeholder}">- select topic -</option>
                        <option th:each="topic : ${topics}"
                                th:value="${topic.id}"
                                th:text="${topic.name}"></option>
                    </select>
                </div>

                <div class="field">
                    <div class="field-label-row">
                        <label for="questionId" th:text="#{form.question}">Question</label>
                    </div>
                    <select id="questionId" name="questionId" class="field-select">
                        <option value="" th:text="#{form.question.placeholder}">- select topic first -</option>
                    </select>
                </div>

                <div class="field">
                    <div class="field-label-row">
                        <label for="text" th:text="#{form.answer}">Answer</label>
                    </div>
                    <textarea id="text" name="text" class="field-textarea" th:placeholder="#{form.answer.placeholder}"></textarea>
                </div>

                <div class="field">
                    <div class="field-label-row">
                        <label for="grade" th:text="#{form.grade}">Grade (1.0 - 5.0)</label>
                    </div>
                    <input id="grade" type="number" name="grade" class="field-input" min="1" max="5" step="0.1" th:placeholder="#{form.grade.placeholder}"/>
                </div>

                <div class="field">
                    <div class="field-label-row">
                        <label for="evaluatorId" th:text="#{form.evaluator}">Evaluator</label>
                    </div>
                    <select id="evaluatorId" name="evaluatorId" class="field-select">
                        <option value="" th:text="#{form.evaluator.placeholder}">- select evaluator -</option>
                        <option th:each="evaluator : ${evaluators}"
                                th:value="${evaluator.id}"
                                th:text="${evaluator.name}"></option>
                    </select>
                </div>

                <div class="field">
                    <div class="field-label-row">
                        <label for="answerDate" th:text="#{form.date}">Answer Date</label>
                    </div>
                    <input id="answerDate" type="date" name="answerDate" class="field-input" th:value="${today}"/>
                </div>

                <button class="btn" type="submit" th:text="#{form.submit}">Save Answer</button>
            </form>
        </div>

    </div>

    <div class="time">
        <span th:text="${currentTime}"></span>
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script th:inline="javascript">
    const i18n = {
        selectQuestion: /*[[#{form.question.placeholder}]]*/    '- select question -'   ,
        selectTopic: /*[[#{form.topic.placeholder}]]*/          '- select topic -'      ,
        validation: {
            topicRequired:      /*[[#{validation.topic.required}]]*/    'Please select a topic.'        ,
            questionRequired:   /*[[#{validation.question.required}]]*/ 'Please select a question.'     ,
            textRequired:       /*[[#{validation.text.required}]]*/     'Please enter your answer.'     ,
            evaluatorRequired:  /*[[#{validation.evaluator.required}]]*/'Please select an evaluator.'   ,
            dateRequired:       /*[[#{validation.date.required}]]*/     'Please select a date.'         ,
            gradeInvalid:       /*[[#{validation.grade.invalid}]]*/     'Grade must be between 1 and 5.'
        }
    };
</script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/toast.js}"></script>
</body>
</html>
